<title>ТравелЕк</title>

:root,:root[data-theme="dark"]{

  --handle:#3a4258;--shadow:0 -12px 40px rgba(0,0,0,.45);--map-bg:#0e1118;
}
:root[data-theme="light"]{
  --bg:#f4f5f7;--panel:#ffffff;--line:#e2e5eb;--text:#1a1d26;--muted:#6b7280;
  --train:#2d8a5e;--plane:#3b74d4;--accent:#b8923a;--future:#7c5cbf;
  --top-grad:linear-gradient(180deg,rgba(244,245,247,.98),rgba(244,245,247,.7),transparent);
  --leg-bg:rgba(255,255,255,.94);--chip:rgba(0,0,0,.04);--row:rgba(0,0,0,.03);--stat:rgba(0,0,0,.04);
  --handle:#c5cad3;--shadow:0 -12px 40px rgba(0,0,0,.12);--map-bg:#e8eaef;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;z-index:0;background:var(--map-bg)}
.leaflet-control-attribution,
.leaflet-control-container .leaflet-bottom,
.leaflet-control-scale{display:none!important;opacity:0!important;height:0!important;overflow:hidden!important}
.leaflet-tile-pane{filter:saturate(0.7) brightness(0.95) contrast(1.05)}
.sheet{max-height:42vh}
.sheet.full{max-height:min(88vh, calc(100dvh - 72px))}
.legend,.zoom{bottom:calc(42vh + 10px)}
.tab{min-height:40px;display:flex;align-items:center;justify-content:center}
.row{min-height:48px}
.zoom button{width:40px;height:40px}
.top{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:var(--top-grad)}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{font-size:18px;font-weight:700}
.top p{font-size:11px;color:var(--muted);margin-top:2px}
#theme-btn{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--leg-bg);color:var(--text);font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:6px;margin-top:10px;pointer-events:auto}
.tab{flex:1;text-align:center;padding:8px 6px;border-radius:10px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted);border:1px solid transparent}
.tab.on{background:rgba(196,163,90,.18);color:var(--text);border-color:rgba(196,163,90,.4)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;max-height:50vh;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);transition:max-height .28s ease}
.sheet.full{max-height:88vh}
.handle{width:36px;height:4px;background:var(--handle);border-radius:2px;margin:8px auto 4px;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 12px 10px}
.stat{background:var(--stat);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted)}
.list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 16px;flex:1}
.year{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 4px 6px}
.row{padding:11px 12px;border-radius:12px;margin-bottom:6px;background:var(--row);border:1px solid transparent}
.row.on{border-color:var(--accent);background:rgba(196,163,90,.12)}
.row.future{border-left:3px solid var(--future)}
.row .title{font-size:14px;font-weight:600;line-height:1.25}
.row .meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;background:var(--chip);margin-right:4px}
.badge.fut{background:rgba(155,123,255,.2);color:#7c5cbf}
:root[data-theme="dark"] .badge.fut{color:#c4b5ff}
.badge.pl{background:rgba(91,141,239,.15);color:var(--plane)}
.badge.tr{background:rgba(61,155,110,.15);color:var(--train)}
.legend{position:fixed;left:10px;bottom:calc(42vh + 10px);z-index:20;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.leg{font-size:11px;padding:4px 8px;border-radius:8px;background:var(--leg-bg);border:1px solid var(--line);color:var(--text)}
.leg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.zoom{position:fixed;right:10px;bottom:calc(42vh + 10px);z-index:20;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--leg-bg);color:var(--text);font-size:18px}
.empty{text-align:center;color:var(--muted);padding:24px;font-size:13px}
</style>
</head>

  if(!a||!b) return null;
  const fk=nearestRailNode(a), tk=nearestRailNode(b);
  const keys=railPathKeys(fk,tk);
  if(keys && keys.length>=2){
    const raw=keys.map(k=>[RAIL_NODES[k][0],RAIL_NODES[k][1]]);
    raw[0]=[a.lat,a.lng];
    raw[raw.length-1]=[b.lat,b.lng];
    return densify(raw, 18);
  }
  // fallback: мягкая дуга, не идеальная прямая
  return densify(greatCircle(a,b,16), 25);
}
function isFuture(r){if(r.status==="future"){const end=r.arrDate||r.date;const t=r.arrTime||"23:59";if(!end)return true;return new Date(end+"T"+t)>new Date()}return false}
function effectiveStatus(r){return isFuture(r)?"future":"past"}
const map=L.map("map",{zoomControl:false,attributionControl:false,minZoom:2,maxZoom:12}).setView([45,50],3);
/* Carto *nolabels* — без названий стран/городов, без водяных знаков и без API-ключа */
const TILES={
  dark:"https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",
  light:"https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png"
};
function makeBase(theme){
  return L.tileLayer(TILES[theme==="light"?"light":"dark"],{
    maxZoom:18, subdomains:"abcd", attribution:""
  });
}
let baseLayer=makeBase("dark").addTo(map);
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme",theme);
  try{localStorage.setItem("travelek-theme",theme)}catch(e){}
  const btn=document.getElementById("theme-btn");
  if(btn) btn.textContent=theme==="light"?"☀️":"🌙";
  if(baseLayer) map.removeLayer(baseLayer);
  baseLayer=makeBase(theme).addTo(map);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",theme==="light"?"#f4f5f7":"#12151f");
}
(function initTheme(){
  let t="dark";
  try{t=localStorage.getItem("travelek-theme")||"dark"}catch(e){}
  applyTheme(t==="light"?"light":"dark");
})();
document.getElementById("theme-btn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme")||"dark";
  applyTheme(cur==="dark"?"light":"dark");
  drawCityLabels();
};
map.on("zoomend",()=>drawCityLabels());
document.getElementById("z-in").onclick=()=>map.zoomIn();
document.getElementById("z-out").onclick=()=>map.zoomOut();
const layer=L.layerGroup().addTo(map);
const labelsLayer=L.layerGroup().addTo(map);
let selectedId=null,activeTab="all";
function buildGeo(r){const a=place(r.from,r.fromCode),b=place(r.to,r.toCode);if(!a||!b)return null;let coords,km;if(r.mode==="plane"){coords=greatCircle(a,b,80);km=hav(a,b)}else{coords=trainCoords(r.from,r.to)||[[a.lat,a.lng],[b.lat,b.lng]];km=0;for(let i=1;i<coords.length;i++)km+=hav({lat:coords[i-1][0],lng:coords[i-1][1]},{lat:coords[i][0],lng:coords[i][1]})}return{coords,km,a,b}}
function filtered(){return ROUTES.filter(r=>{const st=effectiveStatus(r);if(activeTab==="future")return st==="future";if(activeTab==="past")return st==="past";return true}).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))}
function drawCityLabels(){
  labelsLayer.clearLayers();
  const theme=document.documentElement.getAttribute("data-theme")||"dark";
  const color=theme==="light"?"#1a1d26":"#eef0f5";
  const bg=theme==="light"?"rgba(255,255,255,.88)":"rgba(14,17,24,.82)";
  const z=map.getZoom();
  if(z<3) return;
  CITY_LABELS.forEach(c=>{
    L.marker([c.lat,c.lng],{interactive:false,keyboard:false,icon:L.divIcon({
      className:"",
      html:`<div style="transform:translate(-50%,-120%);white-space:nowrap;font:600 11px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;color:${color};background:${bg};padding:2px 7px;border-radius:8px;border:1px solid rgba(128,128,128,.25);box-shadow:0 1px 4px rgba(0,0,0,.2)">${c.name}</div>`,
      iconSize:[0,0],iconAnchor:[0,0]
    })}).addTo(labelsLayer);
  });
}
function render(){layer.clearLayers();const list=filtered();let kmP=0,kmT=0,bounds=[];ROUTES.forEach(r=>{if(effectiveStatus(r)==="future")return;const g=buildGeo(r);if(!g)return;if(r.mode==="plane")kmP+=g.km;else kmT+=g.km});document.getElementById("s-plane").textContent=Math.round(kmP).toLocaleString("ru-RU");document.getElementById("s-train").textContent=Math.round(kmT).toLocaleString("ru-RU");document.getElementById("s-count").textContent=String(ROUTES.length);const futN=ROUTES.filter(r=>effectiveStatus(r)==="future").length;document.getElementById("subtitle").textContent=futN?ROUTES.length+" рейсов · "+futN+" скоро":ROUTES.length+" рейсов";
const fill=getComputedStyle(document.documentElement).getPropertyValue("--map-bg").trim()||"#0e1118";
list.forEach(r=>{const g=buildGeo(r);if(!g||!g.coords)return;const fut=effectiveStatus(r)==="future";const col=fut?COLORS.future:(COLORS[r.mode]||COLORS.plane);const w=r.mode==="train"?4.5:3;L.polyline(g.coords,{color:r.mode==="train"?"#1a3d2a":"#000",weight:w+3,opacity:r.mode==="train"?0.35:0.2,lineJoin:"round",lineCap:"round",interactive:false}).addTo(layer);L.polyline(g.coords,{color:col,weight:selectedId===r.id?w+1.5:w,opacity:fut?0.85:0.95,dashArray:fut?"8 6":null,lineJoin:"round",lineCap:"round",interactive:false}).addTo(layer);if(r.mode==="plane"&&!fut)L.polyline(g.coords,{color:"#fff",weight:1,opacity:.25,interactive:false}).addTo(layer);[g.coords[0],g.coords[g.coords.length-1]].forEach(p=>{L.circleMarker(p,{radius:r.mode==="train"?6:5,color:col,fillColor:fill,fillOpacity:1,weight:2}).addTo(layer)});g.coords.forEach(c=>bounds.push(c))});
drawCityLabels();
const el=document.getElementById("list");if(!list.length){el.innerHTML='<div class="empty">Нет маршрутов в этой вкладке</div>'}else{let html="",lastY="";list.forEach(r=>{const y=(r.date||"").slice(0,4);if(y&&y!==lastY){html+='<div class="year">'+y+'</div>';lastY=y}const fut=effectiveStatus(r)==="future";const g=buildGeo(r);const km=g?Math.round(g.km):0;html+='<div class="row '+(selectedId===r.id?"on":"")+(fut?" future":"")+'" data-id="'+r.id+'"><div class="title">'+(ICONS[r.mode]||"")+" "+r.from+" → "+r.to+'</div><div class="meta"><span class="badge '+(r.mode==="plane"?"pl":"tr")+'">'+(r.flight||r.mode)+"</span>"+(fut?'<span class="badge fut">скоро</span>':"")+" "+(r.date||"")+(r.time?" · "+r.time:"")+(km?" · "+km.toLocaleString("ru-RU")+" км":"")+(r.duration?" · "+r.duration:"")+"</div></div>"});el.innerHTML=html;el.querySelectorAll(".row").forEach(row=>{row.onclick=()=>{selectedId=row.getAttribute("data-id");render();const r=ROUTES.find(x=>x.id===selectedId);const g=r&&buildGeo(r);if(g&&g.coords)map.fitBounds(g.coords,{padding:[50,50],maxZoom:7})}})}if(bounds.length&&!selectedId){try{map.fitBounds(bounds,{padding:[40,100],maxZoom:5})}catch(e){}}}
document.querySelectorAll(".tab").forEach(t=>{t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");activeTab=t.getAttribute("data-tab");selectedId=null;render()}});
document.getElementById("handle").onclick=()=>document.getElementById("sheet").classList.toggle("full");
setInterval(()=>render(),60000);
render();
</script>
</body>
</html>
