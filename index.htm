<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ТравелЕк" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#12151f" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>" />
<title>ТравелЕк</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
:root,:root[data-theme="dark"]{
  --bg:#0e1118;--panel:#1a1f2e;--line:#2a3142;--text:#eef0f5;--muted:#8b93a7;
  --train:#3d9b6e;--plane:#5b8def;--accent:#c4a35a;--future:#9b7bff;
  --top-grad:linear-gradient(180deg,rgba(14,17,24,.97),rgba(14,17,24,.55),transparent);
  --leg-bg:rgba(26,31,46,.92);--chip:rgba(255,255,255,.05);--row:rgba(255,255,255,.03);--stat:rgba(255,255,255,.04);
  --handle:#3a4258;--shadow:0 -12px 40px rgba(0,0,0,.45);--map-bg:#0e1118;
}
:root[data-theme="light"]{
  --bg:#f4f5f7;--panel:#ffffff;--line:#e2e5eb;--text:#1a1d26;--muted:#6b7280;
  --train:#2d8a5e;--plane:#3b74d4;--accent:#b8923a;--future:#7c5cbf;
  --top-grad:linear-gradient(180deg,rgba(244,245,247,.98),rgba(244,245,247,.7),transparent);
  --leg-bg:rgba(255,255,255,.94);--chip:rgba(0,0,0,.04);--row:rgba(0,0,0,.03);--stat:rgba(0,0,0,.04);
  --handle:#c5cad3;--shadow:0 -12px 40px rgba(0,0,0,.12);--map-bg:#e8eaef;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;z-index:0;background:var(--map-bg)}
.leaflet-control-attribution,.leaflet-control-container .leaflet-bottom,
.leaflet-control-scale{display:none!important}
:root[data-theme="dark"] .leaflet-tile-pane{filter:brightness(.92) contrast(1.05)}
:root[data-theme="light"] .leaflet-tile-pane{filter:none}

.top{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:var(--top-grad)}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{font-size:18px;font-weight:700}
.top p{font-size:11px;color:var(--muted);margin-top:2px}
#theme-btn,#add-btn{pointer-events:auto;width:40px;height:40px;border-radius:12px;
  border:1px solid var(--line);background:var(--leg-bg);color:var(--text);font-size:18px;
  display:flex;align-items:center;justify-content:center}
.top-actions{display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin-top:10px;pointer-events:auto}
.tab{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;
  padding:8px 6px;border-radius:10px;font-size:12px;font-weight:600;
  background:var(--chip);color:var(--muted);border:1px solid transparent}
.tab.on{background:rgba(196,163,90,.18);color:var(--text);border-color:rgba(196,163,90,.4)}

/* sheet: collapsed | mid | full */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  transition:height .28s ease, max-height .28s ease;
  height:42vh; max-height:42vh; touch-action:none}
.sheet.mid{height:42vh;max-height:42vh}
.sheet.full{height:min(88vh,calc(100dvh - 72px));max-height:min(88vh,calc(100dvh - 72px))}
.sheet.collapsed{height:72px;max-height:72px}
.sheet.collapsed .stats,
.sheet.collapsed .list,
.sheet.collapsed .sheet-actions{display:none}
.handle-wrap{padding:10px 0 6px;flex-shrink:0;cursor:grab}
.handle{width:40px;height:5px;background:var(--handle);border-radius:3px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 12px 8px;flex-shrink:0}
.stat{background:var(--stat);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted)}
.sheet-actions{padding:0 12px 8px;flex-shrink:0}
.sheet-actions button{width:100%;padding:11px;border-radius:12px;border:1px dashed var(--line);
  background:var(--chip);color:var(--text);font-size:14px;font-weight:600}
.list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 16px;flex:1;touch-action:pan-y}
.year{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 4px 6px}
.row{padding:11px 12px;border-radius:12px;margin-bottom:6px;background:var(--row);border:1px solid transparent;min-height:48px}
.row.on{border-color:var(--accent);background:rgba(196,163,90,.12)}
.row.future{border-left:3px solid var(--future)}
.row .title{font-size:14px;font-weight:600;line-height:1.25}
.row .meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;background:var(--chip);margin-right:4px}
.badge.fut{background:rgba(155,123,255,.2);color:#7c5cbf}
:root[data-theme="dark"] .badge.fut{color:#c4b5ff}
.badge.pl{background:rgba(91,141,239,.15);color:var(--plane)}
.badge.tr{background:rgba(61,155,110,.15);color:var(--train)}
.badge.car{background:rgba(224,160,64,.18);color:#e0a040}
.empty{text-align:center;color:var(--muted);padding:24px;font-size:13px}

.legend{position:fixed;left:10px;z-index:20;display:flex;flex-direction:column;gap:4px;pointer-events:none;
  bottom:calc(42vh + 10px);transition:bottom .28s ease}
.leg{font-size:11px;padding:4px 8px;border-radius:8px;background:var(--leg-bg);border:1px solid var(--line);color:var(--text)}
.leg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.zoom{position:fixed;right:10px;z-index:20;display:flex;flex-direction:column;gap:6px;
  bottom:calc(42vh + 10px);transition:bottom .28s ease}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--leg-bg);color:var(--text);font-size:18px}
body.sheet-collapsed .legend,body.sheet-collapsed .zoom{bottom:90px}
body.sheet-full .legend,body.sheet-full .zoom{bottom:calc(min(88vh,100dvh - 72px) + 10px)}

/* form modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal-card{width:100%;max-width:520px;background:var(--panel);border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.modal-card h2{font-size:17px;margin-bottom:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--chip);color:var(--text);font-size:15px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions button{flex:1;padding:12px;border-radius:12px;border:none;font-size:15px;font-weight:600}
.btn-cancel{background:var(--chip);color:var(--text)}
.btn-save{background:var(--accent);color:#1a1d26}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="top-row">
    <div>
      <h1>🧳 ТравелЕк</h1>
      <p id="subtitle">Ваши маршруты</p>
    </div>
    <div class="top-actions">
      <button type="button" id="add-btn" title="Добавить">＋</button>
      <button type="button" id="theme-btn" title="Тема">🌙</button>
    </div>
  </div>
  <div class="tabs">
    <button type="button" class="tab on" data-tab="all">Все</button>
    <button type="button" class="tab" data-tab="future">Будущие</button>
    <button type="button" class="tab" data-tab="past">История</button>
  </div>
</div>
<div class="legend">
  <div class="leg"><i style="background:var(--plane)"></i>Самолёт</div>
  <div class="leg"><i style="background:var(--train)"></i>Поезд</div>
  <div class="leg"><i style="background:#e0a040"></i>Авто</div>
  <div class="leg"><i style="background:var(--future)"></i>Скоро</div>
</div>
<div class="zoom">
  <button type="button" id="z-in">+</button>
  <button type="button" id="z-out">−</button>
</div>
<div class="sheet mid" id="sheet">
  <div class="handle-wrap" id="handle-wrap"><div class="handle"></div></div>
  <div class="stats">
    <div class="stat"><b id="s-plane">0</b><span>✈️ км</span></div>
    <div class="stat"><b id="s-train">0</b><span>🚂 км</span></div>
    <div class="stat"><b id="s-car">0</b><span>🚗 км</span></div>
  </div>
  <div class="sheet-actions">
    <button type="button" id="add-btn-2">＋ Добавить маршрут</button>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2>Новый маршрут</h2>
    <div class="field">
      <label>Тип</label>
      <select id="f-mode">
        <option value="train">Поезд</option>
        <option value="plane">Самолёт</option>
        <option value="car">Авто</option>
      </select>
    </div>
    <div class="field"><label>Откуда</label><input id="f-from" type="text" placeholder="Москва (Ленинградский) / SVO" autocomplete="off" /></div>
    <div class="field"><label>Куда</label><input id="f-to" type="text" placeholder="Санкт-Петербург / LED" autocomplete="off" /></div>
    <div class="field-row">
      <div class="field"><label>Дата</label><input id="f-date" type="date" /></div>
      <div class="field"><label>Время (необяз.)</label><input id="f-time" type="time" /></div>
    </div>
    <div class="field"><label>Номер рейса / поезда (необяз.)</label><input id="f-flight" type="text" placeholder="SU 100 / Сапсан 756А" /></div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="f-cancel">Отмена</button>
      <button type="button" class="btn-save" id="f-save">Сохранить</button>
    </div>
  </div>
</div>

const RAIL_ADJ = {};
RAIL_EDGES.forEach(([a,b]) => { (RAIL_ADJ[a]=RAIL_ADJ[a]||[]).push(b); (RAIL_ADJ[b]=RAIL_ADJ[b]||[]).push(a); });

  {name:"Москва",lat:55.76,lng:37.62},{name:"Санкт-Петербург",lat:59.93,lng:30.36},
  {name:"Казань",lat:55.79,lng:49.12},{name:"Тула",lat:54.19,lng:37.62},

const COLORS = {plane:"#5b8def",train:"#3d9b6e",car:"#e0a040",future:"#9b7bff"};
const ICONS = {plane:"✈️",train:"🚂",car:"🚗"};
/* Шоссе E11 Дубай — Абу-Даби */
const ROAD_DXB_AUH = [
  [25.2048,55.2708],[25.0657,55.1713],[24.9857,55.0234],
  [24.8660,54.8800],[24.6500,54.6500],[24.4539,54.3773]
];
function carCoords(from,to){
  const a=place(from), b=place(to);
  if(!a||!b) return null;
  const isDxb=n=>/дубай|dubai/i.test(n||"");
  const isAuh=n=>/абу-?даби|abu.?dhabi/i.test(n||"");
  if((isDxb(from)&&isAuh(to))||(isAuh(from)&&isDxb(to))){
    const path = isDxb(from) ? ROAD_DXB_AUH.slice() : ROAD_DXB_AUH.slice().reverse();
    path[0]=[a.lat,a.lng]; path[path.length-1]=[b.lat,b.lng];
    return densify(path, 8);
  }
  return densify([[a.lat,a.lng],[b.lat,b.lng]], 15);
}

function norm(s){ return (s||"").toLowerCase().trim(); }
function place(name, code){
  if (code && PLACES[norm(code)]) { const p=PLACES[norm(code)]; return {lat:p[0],lng:p[1]}; }
  const k = norm(name);
  if (PLACES[k]) return {lat:PLACES[k][0],lng:PLACES[k][1]};
  for (const [key,v] of Object.entries(PLACES)) if (k.includes(key) || key.includes(k)) return {lat:v[0],lng:v[1]};
  return null;
}
function hav(a,b){
  const R=6371,t=Math.PI/180;
  const dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
function greatCircle(a,b,n=72){
  const t=Math.PI/180;
  const lat1=a.lat*t,lng1=a.lng*t,lat2=b.lat*t,lng2=b.lng*t;
  const d=2*Math.asin(Math.min(1,Math.sqrt(Math.sin((lat2-lat1)/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin((lng2-lng1)/2)**2)));
  if(d<1e-8) return [[a.lat,a.lng],[b.lat,b.lng]];
  const out=[];
  for(let i=0;i<=n;i++){
    const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
    const x=A*Math.cos(lat1)*Math.cos(lng1)+B*Math.cos(lat2)*Math.cos(lng2);
    const y=A*Math.cos(lat1)*Math.sin(lng1)+B*Math.cos(lat2)*Math.sin(lng2);
    const z=A*Math.sin(lat1)+B*Math.sin(lat2);
    out.push([Math.atan2(z,Math.sqrt(x*x+y*y))/t, Math.atan2(y,x)/t]);
  }
  return out;
}
function nearestRailNode(pt){
  let best=null,bd=1e9;
  for(const [k,xy] of Object.entries(RAIL_NODES)){
    const d=hav(pt,{lat:xy[0],lng:xy[1]});
    if(d<bd){bd=d;best=k;}
  }
  return best;
}
function railPathKeys(fromKey,toKey){
  if(!fromKey||!toKey) return null;
  if(fromKey===toKey) return [fromKey];
  const q=[fromKey], prev={[fromKey]:null}, seen=new Set([fromKey]);
  while(q.length){
    const u=q.shift();
    for(const v of (RAIL_ADJ[u]||[])){
      if(seen.has(v)) continue;
      seen.add(v); prev[v]=u; q.push(v);
      if(v===toKey){
        const path=[toKey];
        while(path[path.length-1]!==fromKey) path.push(prev[path[path.length-1]]);
        path.reverse(); return path;
      }
    }
  }
  return null;
}
function densify(coords, stepKm){
  if(!coords||coords.length<2) return coords;
  const out=[coords[0]];
  for(let i=1;i<coords.length;i++){
    const a={lat:coords[i-1][0],lng:coords[i-1][1]}, b={lat:coords[i][0],lng:coords[i][1]};
    const d=hav(a,b), n=Math.max(1, Math.round(d/stepKm));
    for(let j=1;j<=n;j++){ const f=j/n; out.push([a.lat+(b.lat-a.lat)*f, a.lng+(b.lng-a.lng)*f]); }
  }
  return out;
}
function trainCoords(from,to){
  const a=place(from), b=place(to);
  if(!a||!b) return null;
  const keys=railPathKeys(nearestRailNode(a), nearestRailNode(b));
  if(keys && keys.length>=2){
    const raw=keys.map(k=>[RAIL_NODES[k][0],RAIL_NODES[k][1]]);
    raw[0]=[a.lat,a.lng]; raw[raw.length-1]=[b.lat,b.lng];
    return densify(raw, 12);
  }
  return densify(greatCircle(a,b,20), 20);
}

function isFuture(r){
  if(r.status==="future"){
    const end=r.arrDate||r.date, t=r.arrTime||"23:59";
    if(!end) return true;
    return new Date(end+"T"+t) > new Date();
  }
  // auto: date in future
  if(r.date && new Date(r.date+"T"+(r.arrTime||r.time||"23:59")) > new Date()) return true;
  return false;
}
function effectiveStatus(r){ return isFuture(r) ? "future" : "past"; }

const map = L.map("map",{zoomControl:false,attributionControl:false,minZoom:2,maxZoom:12}).setView([45,20],4);
/* Esri: без ключа и без водяных знаков.
   dark — спутник (реки, моря, города видны), light — улицы (реки + подписи городов) */
const TILES = {
  dark: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  light: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"
};
function makeBase(theme){
  return L.tileLayer(TILES[theme==="light"?"light":"dark"], {
    maxZoom: 18,
    attribution: ""
  });
}
let baseLayer = makeBase("dark").addTo(map);
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  try{ localStorage.setItem("travelek-theme", theme); }catch(e){}
  document.getElementById("theme-btn").textContent = theme==="light" ? "☀️" : "🌙";
  if(baseLayer) map.removeLayer(baseLayer);
  baseLayer = makeBase(theme).addTo(map);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme==="light"?"#f4f5f7":"#12151f");
  drawCityLabels();
}
(function(){ let t="dark"; try{t=localStorage.getItem("travelek-theme")||"dark";}catch(e){} applyTheme(t==="light"?"light":"dark"); })();
document.getElementById("theme-btn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme")||"dark";
  applyTheme(cur==="dark"?"light":"dark");
};
document.getElementById("z-in").onclick = () => map.zoomIn();
document.getElementById("z-out").onclick = () => map.zoomOut();

const layer = L.layerGroup().addTo(map);
const labelsLayer = L.layerGroup().addTo(map);
let selectedId = null, activeTab = "all";

function buildGeo(r){
  const a=place(r.from,r.fromCode), b=place(r.to,r.toCode);
  if(!a||!b) return null;
  let coords, km;
  if(r.mode==="plane"){ coords=greatCircle(a,b,80); km=hav(a,b); }
  else if(r.mode==="car"){
    coords = carCoords(r.from,r.to) || densify([[a.lat,a.lng],[b.lat,b.lng]], 15);
    km=0; for(let i=1;i<coords.length;i++) km+=hav({lat:coords[i-1][0],lng:coords[i-1][1]},{lat:coords[i][0],lng:coords[i][1]});
  } else {
    coords = trainCoords(r.from,r.to) || [[a.lat,a.lng],[b.lat,b.lng]];
    km=0; for(let i=1;i<coords.length;i++) km+=hav({lat:coords[i-1][0],lng:coords[i-1][1]},{lat:coords[i][0],lng:coords[i][1]});
  }
  return {coords,km,a,b};
}
function filtered(){
  return ROUTES.filter(r=>{
    const st=effectiveStatus(r);
    if(activeTab==="future") return st==="future";
    if(activeTab==="past") return st==="past";
    return true;
  }).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}
function drawCityLabels(){
  labelsLayer.clearLayers();
  if(map.getZoom()<3) return;
  const theme=document.documentElement.getAttribute("data-theme")||"dark";
  const color=theme==="light"?"#1a1d26":"#eef0f5";
  const bg=theme==="light"?"rgba(255,255,255,.88)":"rgba(14,17,24,.82)";
  CITY_LABELS.forEach(c=>{
    L.marker([c.lat,c.lng],{interactive:false,keyboard:false,icon:L.divIcon({
      className:"",
      html:`<div style="transform:translate(-50%,-120%);white-space:nowrap;font:600 11px/1.2 -apple-system,sans-serif;color:${color};background:${bg};padding:2px 7px;border-radius:8px;border:1px solid rgba(128,128,128,.25)">${c.name}</div>`,
      iconSize:[0,0],iconAnchor:[0,0]
    })}).addTo(labelsLayer);
  });
}
map.on("zoomend", drawCityLabels);

function render(){
  layer.clearLayers();
  const list = filtered();
  let kmP=0, kmT=0, kmC=0, bounds=[];
  ROUTES.forEach(r=>{
    if(effectiveStatus(r)==="future") return;
    const g=buildGeo(r); if(!g) return;
    if(r.mode==="plane") kmP+=g.km;
    else if(r.mode==="car") kmC+=g.km;
    else kmT+=g.km;
  });
  document.getElementById("s-plane").textContent = Math.round(kmP).toLocaleString("ru-RU");
  document.getElementById("s-train").textContent = Math.round(kmT).toLocaleString("ru-RU");
  document.getElementById("s-car").textContent = Math.round(kmC).toLocaleString("ru-RU");
  const futN = ROUTES.filter(r=>effectiveStatus(r)==="future").length;
  document.getElementById("subtitle").textContent = futN ? ROUTES.length+" рейсов · "+futN+" скоро" : ROUTES.length+" рейсов";

  const fill = getComputedStyle(document.documentElement).getPropertyValue("--map-bg").trim() || "#0e1118";
  list.forEach(r=>{
    const g=buildGeo(r); if(!g||!g.coords) return;
    const fut=effectiveStatus(r)==="future";
    const col=fut?COLORS.future:(COLORS[r.mode]||COLORS.plane);
    const w=r.mode==="train"?4.5:(r.mode==="car"?4:3);
    const under=r.mode==="train"?"#1a3d2a":(r.mode==="car"?"#4a3010":"#000");
    L.polyline(g.coords,{color:under,weight:w+3,opacity:0.3,lineJoin:"round",lineCap:"round",interactive:false}).addTo(layer);
    L.polyline(g.coords,{color:col,weight:selectedId===r.id?w+1.5:w,opacity:fut?0.85:0.95,dashArray:fut?"8 6":(r.mode==="car"?"1 0":null),lineJoin:"round",lineCap:"round",interactive:false}).addTo(layer);
    if(r.mode==="plane"&&!fut) L.polyline(g.coords,{color:"#fff",weight:1,opacity:.25,interactive:false}).addTo(layer);
    [g.coords[0], g.coords[g.coords.length-1]].forEach(p=>{
      L.circleMarker(p,{radius:r.mode==="train"?6:5,color:col,fillColor:fill,fillOpacity:1,weight:2}).addTo(layer);
    });
    g.coords.forEach(c=>bounds.push(c));
  });
  drawCityLabels();

  const el = document.getElementById("list");
  if(!list.length){ el.innerHTML = '<div class="empty">Нет маршрутов</div>'; }
  else {
    let html="", lastY="";
    list.forEach(r=>{
      const y=(r.date||"").slice(0,4);
      if(y && y!==lastY){ html += '<div class="year">'+y+'</div>'; lastY=y; }
      const fut=effectiveStatus(r)==="future";
      const g=buildGeo(r);
      const km=g?Math.round(g.km):0;
      html += '<div class="row '+(selectedId===r.id?"on":"")+(fut?" future":"")+'" data-id="'+r.id+'">'+
        '<div class="title">'+(ICONS[r.mode]||"")+" "+r.from+" → "+r.to+'</div>'+
        '<div class="meta"><span class="badge '+(r.mode==="plane"?"pl":r.mode==="car"?"car":"tr")+'">'+(r.flight||r.mode)+'</span>'+
        (fut?'<span class="badge fut">скоро</span>':'')+
        " "+(r.date||"")+(r.time?" · "+r.time:"")+
        (km?" · "+km.toLocaleString("ru-RU")+" км":"")+
        (r.duration?" · "+r.duration:"")+"</div></div>";
    });
    el.innerHTML = html;
    el.querySelectorAll(".row").forEach(row=>{
      row.onclick = () => {
        selectedId = row.getAttribute("data-id");
        render();
        const r = ROUTES.find(x=>x.id===selectedId);
        const g = r && buildGeo(r);
        if(g && g.coords) map.fitBounds(g.coords, {padding:[50,50], maxZoom:8});
      };
    });
  }
  if(bounds.length && !selectedId){ try{ map.fitBounds(bounds,{padding:[40,100],maxZoom:5}); }catch(e){} }
}

/* —— sheet swipe —— */
const sheet = document.getElementById("sheet");
let sheetState = "mid"; // collapsed | mid | full
function setSheet(state){
  sheetState = state;
  sheet.classList.remove("collapsed","mid","full");
  sheet.classList.add(state);
  document.body.classList.remove("sheet-collapsed","sheet-full");
  if(state==="collapsed") document.body.classList.add("sheet-collapsed");
  if(state==="full") document.body.classList.add("sheet-full");
}
let touchY0=null, startState=null;
const handleWrap = document.getElementById("handle-wrap");
function onStart(y){ touchY0=y; startState=sheetState; }
function onMove(y){
  if(touchY0==null) return;
  const dy = y - touchY0;
  if(dy > 50 && (startState==="mid"||startState==="full")) setSheet(startState==="full"?"mid":"collapsed");
  else if(dy < -50 && (startState==="collapsed"||startState==="mid")) setSheet(startState==="collapsed"?"mid":"full");
}
function onEnd(){ touchY0=null; }
handleWrap.addEventListener("touchstart", e=>{ onStart(e.touches[0].clientY); }, {passive:true});
handleWrap.addEventListener("touchmove", e=>{ onMove(e.touches[0].clientY); }, {passive:true});
handleWrap.addEventListener("touchend", onEnd);
handleWrap.addEventListener("mousedown", e=>{ onStart(e.clientY);
  const mm = ev => onMove(ev.clientY);
  const mu = () => { onEnd(); window.removeEventListener("mousemove",mm); window.removeEventListener("mouseup",mu); };
  window.addEventListener("mousemove", mm); window.addEventListener("mouseup", mu);
});
handleWrap.onclick = () => {
  if(sheetState==="collapsed") setSheet("mid");
  else if(sheetState==="mid") setSheet("full");
  else setSheet("mid");
};

document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");
    activeTab = t.getAttribute("data-tab");
    selectedId = null;
    render();
  };
});

/* —— add form —— */
const modal = document.getElementById("modal");
function openForm(){ modal.classList.add("on"); }
function closeForm(){ modal.classList.remove("on"); }
document.getElementById("add-btn").onclick = openForm;
document.getElementById("add-btn-2").onclick = openForm;
document.getElementById("f-cancel").onclick = closeForm;
modal.addEventListener("click", e=>{ if(e.target===modal) closeForm(); });
document.getElementById("f-save").onclick = () => {
  const mode = document.getElementById("f-mode").value;
  const from = document.getElementById("f-from").value.trim();
  const to = document.getElementById("f-to").value.trim();
  const date = document.getElementById("f-date").value;
  const time = document.getElementById("f-time").value;
  const flight = document.getElementById("f-flight").value.trim() || (mode==="plane"?"Flight":"Train");
  if(!from || !to || !date){ alert("Укажите откуда, куда и дату"); return; }
  if(!place(from) || !place(to)){
    alert("Точка не найдена в каталоге. Используйте известный город/вокзал/аэропорт (например Milan Central, SVO, Москва (Ленинградский)).");
    return;
  }
  const trip = { id:"u"+Date.now(), mode, flight, from, to, date, time: time||undefined, custom:true };
  const extra = loadExtra();
  extra.push(trip);
  saveExtra(extra);
  ROUTES = BUILTIN.concat(extra);
  closeForm();
  document.getElementById("f-from").value="";
  document.getElementById("f-to").value="";
  document.getElementById("f-flight").value="";
  setSheet("mid");
  render();
};

setInterval(render, 60000);
setSheet("mid");
render();
</script>
